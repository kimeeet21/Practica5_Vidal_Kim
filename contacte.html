<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="Kim" content="Vidal Gali">
  <title>Contacte: crea el teu compte al club d'esquí</title>
  <meta name="description" content="Formulari de registre del club d'esquí amb nom, cognoms, correu i contrasenya.">
  <meta name="keywords" content="registre, compte, contrasenya, formulari, contacte, esquí">
  <link rel="stylesheet" href="css/estils.css">
  <script src="components/rellotge.js" defer></script>
</head>
<body>
  <div id="rellotge" title="Temps a la pàgina">00:00:00</div>
  <header>
    <h1>Contacte</h1>
    <p>Uneix-te al club i comença la temporada.</p>
    <nav>
      <a href="index.html">Inici</a>
      <a href="galeria.html">Galeria</a>
      <a href="contacte.html" class="actiu">Contacte</a>
    </nav>
  </header>
  <main>
    <h2>Crea el teu compte</h2>
    <p>Omple totes les dades. La contrasenya ha de tenir mínim 8 caràcters.</p>
    <form action="#">
      <div class="parella">
        <div class="camp">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" autocomplete="given-name">
        </div>
        <div class="camp">
          <label for="cognoms">Cognoms</label>
          <input type="text" id="cognoms" name="cognoms" autocomplete="family-name">
        </div>
      </div>
      <div class="camp">
        <label for="correu">Correu electrònic</label>
        <input type="email" id="correu" name="correu" autocomplete="email">
      </div>
      <div class="camp">
        <label for="pass1">Contrasenya</label>
        <input type="password" id="pass1" name="pass1" autocomplete="new-password">
      </div>
      <div class="camp">
        <label for="pass2">Repeteix la contrasenya</label>
        <input type="password" id="pass2" name="pass2" autocomplete="new-password">
      </div>
      <button type="button" id="canvia">Crea el compte</button>
    </form>
  </main>
  <footer><p>Pràctica A5 de Llenguatges de marques</p></footer>
  <script src="components/password.js"></script>
</body>
</html>
